<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro — Contas a pagar e receber</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>try{var c=JSON.parse(localStorage.getItem("cf2_cfg")||"{}");if(c.url){var l=document.createElement("link");l.rel="preconnect";l.href=new URL(c.url).origin;l.crossOrigin="";document.head.appendChild(l);}}catch(e){}</script>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="offline-banner" id="offlineBanner" style="display:none">🔴 Sem conexão com a internet — as alterações não serão salvas até reconectar.</div>

<!-- Tela de conexão (só aparece se não houver credenciais) -->
<div class="conectar" id="telaConectar" style="display:none">
  <div class="conectar-box">
    <div class="logo">R$</div>
    <h1>Conectar ao Supabase</h1>
    <p class="hint">Cole a <b>Project URL</b> e a <b>anon public key</b> (Project Settings → API). Ficam salvas só neste navegador.</p>
    <div class="field"><label>Project URL</label><input id="cfgUrl" type="text" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>anon public key</label><input id="cfgKey" type="password" placeholder="eyJ..."></div>
    <button type="button" class="btn-primary" id="btnConectar">Conectar</button>
  </div>
</div>

<div class="app-shell" id="app" style="display:none">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">R$</div>
      <div><div class="sidebar-titulo">Controle Financeiro</div><div class="sidebar-sub">contas a pagar e receber</div></div>
    </div>
    <nav class="sidebar-nav" id="nav" aria-label="Telas">
      <button type="button" class="nav-item active" data-view="hoje">🏠 <span>Hoje</span></button>
      <button type="button" class="nav-item" data-view="lista">📋 <span>Todas as contas</span></button>
      <button type="button" class="nav-item" data-view="cartoes">💳 <span>Cartões e faturas</span></button>
      <button type="button" class="nav-item" data-view="agenda">📅 <span>Agenda</span></button>
      <button type="button" class="nav-item" data-view="contas">🏦 <span>Saldos e pessoas</span></button>
      <button type="button" class="nav-item" data-view="importar">📥 <span>Importar extrato</span></button>
      <button type="button" class="nav-item" data-view="analises">📊 <span>Análises</span></button>
    </nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main-content">
    <header class="topbar">
      <button type="button" class="hamburger" id="btnHamburger" title="Menu">☰</button>
      <div class="tb-nav" id="tbMes">
        <button type="button" class="tb-btn" id="mesAnt" title="Mês anterior">‹</button>
        <span class="tb-period" id="tbPeriodo"></span>
        <button type="button" class="tb-btn" id="mesProx" title="Próximo mês">›</button>
        <button type="button" class="tb-btn tb-hoje" id="mesHoje">Hoje</button>
      </div>
      <span class="sync" id="sync" hidden>⏳ Salvando…</span>
      <div class="tb-titulo" id="tbTitulo"></div>
    </header>

    <main class="wrap">
      <div class="carregando" id="carregando">⏳ Carregando seus dados…</div>
      <section class="view" id="viewHoje"></section>
      <section class="view" id="viewLista" hidden></section>
      <section class="view" id="viewCartoes" hidden></section>
      <section class="view" id="viewAgenda" hidden></section>
      <section class="view" id="viewContas" hidden></section>
      <section class="view" id="viewImportar" hidden></section>
      <section class="view" id="viewAnalises" hidden></section>
    </main>
    <footer id="rodape"></footer>
  </div>
</div>

<button type="button" class="fab-add" id="fabNovo" title="Novo título" style="display:none">+</button>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="assets/js/config.js" onerror="void 0"></script>
<script defer src="assets/js/utils.js"></script>
<script defer src="assets/js/toast.js"></script>
<script defer src="assets/js/dialog.js"></script>
<script defer src="assets/js/parsers.js"></script>
<script defer src="assets/js/store.js"></script>
<script defer src="assets/js/recorrencia.js"></script>
<script defer src="assets/js/form.js"></script>
<script defer src="assets/js/actions.js"></script>
<script defer src="assets/js/views-hoje.js"></script>
<script defer src="assets/js/views-lista.js"></script>
<script defer src="assets/js/views-cartoes.js"></script>
<script defer src="assets/js/views-agenda.js"></script>
<script defer src="assets/js/views-contas.js"></script>
<script defer src="assets/js/views-importar.js"></script>
<script defer src="assets/js/views-analises.js"></script>
<script defer src="assets/js/main.js"></script>
</body>
</html>
